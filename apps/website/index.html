<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hello.ando</title>
    <script>
      // Apply a saved theme before first paint. Kept in sync with src/theme-toggle.ts.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="/" aria-label="hello.ando, home">
        <!-- wordmark.svg takes its colours from design-system tokens through <use> -->
        <svg viewBox="0 0 6177.8 887.4" aria-hidden="true" focusable="false">
          <use href="/wordmark.svg#logo" />
        </svg>
      </a>
      <!-- hidden until src/theme-toggle.ts wires it up, so it never shows without JS -->
      <button
        id="theme-toggle"
        class="ui-button ui-button--icon"
        type="button"
        aria-label="Theme: System"
        hidden
      ></button>
    </header>
    <main class="site-main">
      <!-- the lines take turns, one per 6s typing loop (see typewriter.css).
           Screen readers get the static label, not the animated lines. -->
      <h1 class="tw-cycle">
        <span class="tw-loop" aria-hidden="true"
          >what's <span class="tw-accent">this</span> then<span class="tw-punctuation"></span
        ></span>
        <span class="tw-loop" aria-hidden="true"
          >watch <span class="tw-accent">this</span> space<span class="tw-punctuation second"></span
        ></span>
        <!-- keep last: the cycle's :nth-child delays count from the first line -->
        <span class="tw-label">what's this then? watch this space!</span>
      </h1>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
