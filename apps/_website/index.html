<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Fira+Code:wght@500&display=swap"
    />
    <link rel="stylesheet" href="/src/components/lockup-animation/lockup-animation.css" />

    <title>hello.ando</title>
    <script>
      // Apply a saved theme before first paint. Kept in sync with src/theme-toggle.ts.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
      // Splash only on the first page load of a visit. Same try/catch reason as above.
      // TODO: revisit this once the splash is a proper component, so it can be toggled on/off in the UI. Also have this wait for the page to load (vs a set timeout)
      try {
        // if (sessionStorage.getItem("splash")) document.documentElement.dataset.splash = "seen";
        // else sessionStorage.setItem("splash", "seen");
      } catch {}
    </script>
    <!-- Splash: two versions, use one. Timer (CSS only):
         <link rel="stylesheet" href="/src/components/splash/splash-timer.css" />
       Load (waits for the page to load, 1.5s min): -->
    <link rel="stylesheet" href="/src/components/splash/splash-load.css" />
    <script type="module" src="/src/components/splash/splash-load.ts"></script>
    <!-- <link rel="stylesheet" href="/src/components/splash/splash-timer.css" /> -->
  </head>

  <body>
    <!-- Brief intro: the spans are written out so it paints before ui's JS runs.
       aria-hidden because it's decoration that's gone in about 3s. -->
    <div class="splash" aria-hidden="true">
      <ui-lockup class="ui-lockup"
        ><span>~/</span><span>hello</span><span>.</span><span>ando</span><span>_</span></ui-lockup
      >
    </div>
    <header class="site-header">
      <a class="site-logo" href="/" aria-label="hello.ando, home">
        <!-- wordmark.svg takes its colours from design-system tokens through <use> -->
        <svg viewBox="0 0 6177.8 887.4" aria-hidden="true" focusable="false">
          <use href="/wordmark.svg#logo" />
        </svg>
      </a>
      <!-- hidden until src/theme-toggle.ts wires it up, so it never shows without JS -->
      <button
        id="theme-toggle"
        class="ui-button ui-button--icon"
        type="button"
        aria-label="Theme: System"
        hidden
      ></button>
    </header>
    <main class="site-main">
      <!-- the lines take turns, one per 6s typing loop (see typewriter.css).
           Screen readers get the static label, not the animated lines. -->
      <h1 class="tw-cycle">
        <span class="tw-loop" aria-hidden="true"
          >what's <span class="tw-accent">this</span> then<span class="tw-punctuation"></span
        ></span>
        <span class="tw-loop" aria-hidden="true"
          >watch <span class="tw-accent">this</span> space<span class="tw-punctuation second"></span
        ></span>
        <!-- keep last: the cycle's :nth-child delays count from the first line -->
        <span class="tw-label">what's this then? watch this space!</span>
      </h1>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      import "ui";
    </script>
  </body>
</html>
